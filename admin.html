<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd400">
  <title>NASI BUKUH — Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3JQ5c8M7Q4x3Y5V5j5lY8w5h5q6o="
    crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🍚 NASI BUKUH</div>
    <div class="badge">ADMIN</div>
  </header>

  <main>
    <section class="card">
      <h1>Runner Tracking</h1>
      <p class="muted">Dashboard V1 — lokasi terakhir runner.</p>

      <label for="adminToken">Admin Token</label>
      <input id="adminToken" type="password" placeholder="Token admin" autocomplete="off">

      <label for="runnerId">Runner ID</label>
      <input id="runnerId" value="R001" autocomplete="off">

      <button id="monitorBtn" class="btn primary" type="button">🗺️ MULA MONITOR</button>
      <button id="stopMonitorBtn" class="btn dark" type="button" disabled>⏹️ STOP MONITOR</button>

      <div id="statusBox" class="status offline">⚫ BELUM MONITOR</div>
      <div id="errorBox" class="error hidden"></div>
    </section>

    <section class="mapCard">
      <div id="map"></div>
    </section>

    <section class="card">
      <div class="info">
        <div><span>Latitude</span><strong id="lat">-</strong></div>
        <div><span>Longitude</span><strong id="lng">-</strong></div>
        <div><span>Accuracy</span><strong id="accuracy">-</strong></div>
        <div><span>Status</span><strong id="runnerStatus">-</strong></div>
        <div><span>Last Seen</span><strong id="lastSeen">-</strong></div>
        <div><span>Age</span><strong id="age">-</strong></div>
      </div>
    </section>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>

<script>
const CONFIG = {
  API_URL: "PASTE_WORKER_URL_HERE"
};

let map = null;
let marker = null;
let timer = null;
let followRunner = true;

const $ = (id) => document.getElementById(id);

function setStatus(text, type) {
  $("statusBox").textContent = text;
  $("statusBox").className = "status " + type;
}

function showError(message) {
  $("errorBox").textContent = message;
  $("errorBox").classList.remove("hidden");
}

function clearError() {
  $("errorBox").textContent = "";
  $("errorBox").classList.add("hidden");
}

function ensureMap() {
  if (map) return;

  map = L.map("map").setView([3.0, 101.5], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  map.on("dragstart", () => { followRunner = false; });
}

async function updateLocation() {
  const token = $("adminToken").value.trim();
  const runnerId = $("runnerId").value.trim();

  if (!token || !runnerId) return;

  try {
    const response = await fetch(
      CONFIG.API_URL + "/api/location?runnerId=" + encodeURIComponent(runnerId),
      { headers: { "Authorization": "Bearer " + token } }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Request failed");
    }

    if (!result.data) {
      setStatus("⚫ BELUM ADA DATA", "offline");
      $("runnerStatus").textContent = "NO DATA";
      return;
    }

    const data = result.data;
    const lat = Number(data.latitude);
    const lng = Number(data.longitude);

    $("lat").textContent = lat.toFixed(6);
    $("lng").textContent = lng.toFixed(6);
    $("accuracy").textContent = `${Math.round(data.accuracy || 0)} m`;
    $("runnerStatus").textContent = data.status || "-";
    $("lastSeen").textContent = new Date(data.lastSeen).toLocaleString("ms-MY");

    const ageSec = Math.max(0, Math.round((Date.now() - new Date(data.lastSeen).getTime()) / 1000));
    $("age").textContent = `${ageSec}s`;

    if (data.status === "ONLINE") {
      setStatus("🟢 RUNNER ONLINE", "online");
    } else {
      setStatus("⚫ RUNNER OFFLINE", "offline");
    }

    if (!marker) {
      marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup("🛵 NASI BUKUH — " + runnerId);
    } else {
      marker.setLatLng([lat, lng]);
    }

    if (followRunner) {
      map.setView([lat, lng], Math.max(map.getZoom(), 15));
    }

    clearError();
  } catch (err) {
    console.error(err);
    setStatus("🔴 CONNECTION ERROR", "offline");
    showError(err.message);
  }
}

function startMonitoring() {
  clearError();

  if (!CONFIG.API_URL || CONFIG.API_URL.includes("PASTE_WORKER")) {
    showError("API URL belum ditetapkan dalam admin.html.");
    return;
  }

  if (!$("adminToken").value.trim()) {
    showError("Masukkan Admin Token.");
    return;
  }

  ensureMap();

  if (timer) clearInterval(timer);
  updateLocation();
  timer = setInterval(updateLocation, 5000);

  $("monitorBtn").disabled = true;
  $("stopMonitorBtn").disabled = false;
}

function stopMonitoring() {
  if (timer) clearInterval(timer);
  timer = null;
  $("monitorBtn").disabled = false;
  $("stopMonitorBtn").disabled = true;
  setStatus("⚫ MONITOR STOPPED", "offline");
}

$("monitorBtn").addEventListener("click", startMonitoring);
$("stopMonitorBtn").addEventListener("click", stopMonitoring);
</script>
</body>
</html>
